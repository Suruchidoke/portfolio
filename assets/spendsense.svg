<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background:#090d16; font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.8)"/>
    </linearGradient>

    <linearGradient id="alert-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(239, 68, 68, 0.2)"/>
      <stop offset="100%" stop-color="rgba(185, 28, 28, 0.05)"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Background Glows -->
  <rect width="800" height="600" fill="url(#bg-grad)"/>
  <circle cx="150" cy="80" r="140" fill="#06b6d4" opacity="0.12" filter="url(#glow-soft)"/>
  <circle cx="700" cy="480" r="160" fill="#3b82f6" opacity="0.1" filter="url(#glow-soft)"/>
  <circle cx="450" cy="20" r="100" fill="#10b981" opacity="0.08" filter="url(#glow-soft)"/>

  <!-- Top Navigation Bar -->
  <g id="navbar">
    <rect x="25" y="20" width="750" height="52" rx="12" fill="rgba(30, 41, 59, 0.5)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    
    <!-- SpendSense AI Logo & Icon -->
    <g transform="translate(42, 33)">
      <rect width="26" height="26" rx="7" fill="url(#primary-grad)"/>
      <!-- Wallet icon -->
      <path d="M6 9h14v10a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9zm2-4h10a2 2 0 0 1 2 2v1H6V7a2 2 0 0 1 2-2z" fill="#ffffff" transform="translate(0,-1) scale(0.9)"/>
      <circle cx="17" cy="14" r="1.5" fill="#090d16"/>
    </g>
    <text x="76" y="50" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="-0.3">SpendSense</text>
    <rect x="175" y="37" width="26" height="18" rx="4" fill="url(#primary-grad)"/>
    <text x="180" y="50" font-size="10" font-weight="800" fill="#ffffff">AI</text>

    <!-- Nav Items -->
    <rect x="220" y="31" width="82" height="30" rx="8" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="1"/>
    <text x="235" y="51" font-size="12" font-weight="600" fill="#38bdf8">Dashboard</text>
    <text x="325" y="51" font-size="12" font-weight="500" fill="#94a3b8">Analytics</text>
    <text x="400" y="51" font-size="12" font-weight="500" fill="#94a3b8">Investments</text>
    <text x="495" y="51" font-size="12" font-weight="500" fill="#94a3b8">Budgets</text>

    <!-- Status Badge -->
    <g transform="translate(620, 33)">
      <rect width="135" height="26" rx="13" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
      <circle cx="15" cy="13" r="4" fill="#10b981" filter="url(#glow-cyan)"/>
      <text x="26" y="17" font-size="11" font-weight="600" fill="#34d399">ML Models Active</text>
    </g>
  </g>

  <!-- KPI Cards Row -->
  <g id="kpi-cards">
    <!-- Card 1: Net Worth -->
    <g transform="translate(25, 88)">
      <rect width="175" height="88" rx="12" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="16" y="28" font-size="11" font-weight="500" fill="#94a3b8">Executive Net Worth</text>
      <text x="16" y="58" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="-0.5">₹12,45,000</text>
      <rect x="110" y="16" width="50" height="18" rx="9" fill="rgba(16, 185, 129, 0.15)"/>
      <text x="118" y="29" font-size="10" font-weight="700" fill="#34d399">+6.4%</text>
      <text x="16" y="76" font-size="10" fill="#64748b">Liquid + Invested Assets</text>
    </g>

    <!-- Card 2: Liquid Funds -->
    <g transform="translate(216, 88)">
      <rect width="175" height="88" rx="12" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="16" y="28" font-size="11" font-weight="500" fill="#94a3b8">Liquid Liquidity</text>
      <text x="16" y="58" font-size="22" font-weight="800" fill="#38bdf8" letter-spacing="-0.5">₹3,20,000</text>
      <text x="16" y="76" font-size="10" fill="#64748b">Bank (UPI) + Cash in Hand</text>
    </g>

    <!-- Card 3: Monthly Spend -->
    <g transform="translate(408, 88)">
      <rect width="175" height="88" rx="12" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="16" y="28" font-size="11" font-weight="500" fill="#94a3b8">Monthly Expenses</text>
      <text x="16" y="58" font-size="22" font-weight="800" fill="#f43f5e" letter-spacing="-0.5">₹42,500</text>
      <text x="16" y="76" font-size="10" fill="#64748b">Paise Precision Engine</text>
    </g>

    <!-- Card 4: Savings Rate -->
    <g transform="translate(600, 88)">
      <rect width="175" height="88" rx="12" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="16" y="28" font-size="11" font-weight="500" fill="#94a3b8">Savings Rate</text>
      <text x="16" y="58" font-size="22" font-weight="800" fill="#10b981" letter-spacing="-0.5">48.2%</text>
      <rect x="115" y="16" width="46" height="18" rx="9" fill="rgba(16, 185, 129, 0.15)"/>
      <text x="122" y="29" font-size="10" font-weight="700" fill="#34d399">Prime</text>
      <text x="16" y="76" font-size="10" fill="#64748b">Investments vs Income</text>
    </g>
  </g>

  <!-- Main Analytics Row -->
  <g id="main-analytics">
    <!-- Left Card: Expense Category Donut -->
    <g transform="translate(25, 192)">
      <rect width="365" height="280" rx="12" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="20" y="32" font-size="14" font-weight="700" fill="#ffffff">Category Spend Analytics</text>
      <text x="20" y="48" font-size="11" fill="#64748b">Pandas Aggregation Breakdown</text>

      <!-- Donut Chart Graphics -->
      <g transform="translate(130, 155)">
        <!-- Donut slices (Arcs) -->
        <circle cx="0" cy="0" r="75" fill="none" stroke="#1e293b" stroke-width="24"/>
        <!-- Housing 38% -->
        <circle cx="0" cy="0" r="75" fill="none" stroke="#3b82f6" stroke-width="24" stroke-dasharray="180 300" stroke-dashoffset="0"/>
        <!-- Food 24% -->
        <circle cx="0" cy="0" r="75" fill="none" stroke="#06b6d4" stroke-width="24" stroke-dasharray="115 365" stroke-dashoffset="-185"/>
        <!-- Investments 22% -->
        <circle cx="0" cy="0" r="75" fill="none" stroke="#10b981" stroke-width="24" stroke-dasharray="105 375" stroke-dashoffset="-305"/>
        <!-- Utilities 16% -->
        <circle cx="0" cy="0" r="75" fill="none" stroke="#f59e0b" stroke-width="24" stroke-dasharray="75 405" stroke-dashoffset="-415"/>
        
        <!-- Center Text -->
        <text x="0" y="-4" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">₹42.5k</text>
        <text x="0" y="14" text-anchor="middle" font-size="10" font-weight="500" fill="#94a3b8">Total Outflow</text>
      </g>

      <!-- Legend -->
      <g transform="translate(250, 85)" font-size="11" fill="#cbd5e1">
        <circle cx="6" cy="12" r="5" fill="#3b82f6"/>
        <text x="18" y="16">Housing (38%)</text>
        
        <circle cx="6" cy="42" r="5" fill="#06b6d4"/>
        <text x="18" y="46">Food &amp; Dining (24%)</text>

        <circle cx="6" cy="72" r="5" fill="#10b981"/>
        <text x="18" y="76">SIP &amp; Assets (22%)</text>

        <circle cx="6" cy="102" r="5" fill="#f59e0b"/>
        <text x="18" y="106">Utilities (16%)</text>
      </g>

      <!-- Bottom Insight Pill -->
      <g transform="translate(20, 235)">
        <rect width="325" height="30" rx="8" fill="rgba(6, 182, 212, 0.1)" stroke="rgba(6, 182, 212, 0.25)" stroke-width="1"/>
        <text x="12" y="20" font-size="11" font-weight="500" fill="#38bdf8">💡 AI Insight: Food expenses down 14% vs last month</text>
      </g>
    </g>

    <!-- Right Card: Cashflow Trends & ML Anomaly -->
    <g transform="translate(408, 192)">
      <rect width="367" height="280" rx="12" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="20" y="32" font-size="14" font-weight="700" fill="#ffffff">Cashflow Trends &amp; ML Detection</text>
      <text x="20" y="48" font-size="11" fill="#64748b">Income vs Expense vs Investments</text>

      <!-- Isolation Forest Anomaly Badge -->
      <g transform="translate(195, 14)">
        <rect width="158" height="26" rx="6" fill="url(#alert-grad)" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1"/>
        <circle cx="12" cy="13" r="3.5" fill="#ef4444"/>
        <text x="22" y="17" font-size="10" font-weight="700" fill="#fca5a5">ML Anomaly Flagged</text>
      </g>

      <!-- Multi-bar Chart Area -->
      <g transform="translate(30, 80)">
        <!-- Gridlines -->
        <line x1="0" y1="0" x2="310" y2="0" stroke="rgba(255, 255, 255, 0.05)" stroke-dasharray="4"/>
        <line x1="0" y1="35" x2="310" y2="35" stroke="rgba(255, 255, 255, 0.05)" stroke-dasharray="4"/>
        <line x1="0" y1="70" x2="310" y2="70" stroke="rgba(255, 255, 255, 0.05)" stroke-dasharray="4"/>
        <line x1="0" y1="105" x2="310" y2="105" stroke="rgba(255, 255, 255, 0.1)"/>

        <!-- Month 1: Aug -->
        <rect x="25" y="25" width="14" height="80" rx="3" fill="#3b82f6"/>
        <rect x="42" y="55" width="14" height="50" rx="3" fill="#f43f5e"/>
        <rect x="59" y="65" width="14" height="40" rx="3" fill="#10b981"/>
        <text x="42" y="122" font-size="10" fill="#64748b">Aug</text>

        <!-- Month 2: Sep -->
        <rect x="105" y="20" width="14" height="85" rx="3" fill="#3b82f6"/>
        <rect x="122" y="50" width="14" height="55" rx="3" fill="#f43f5e"/>
        <rect x="139" y="60" width="14" height="45" rx="3" fill="#10b981"/>
        <text x="122" y="122" font-size="10" fill="#64748b">Sep</text>

        <!-- Month 3: Oct (Anomaly Spiked) -->
        <rect x="185" y="15" width="14" height="90" rx="3" fill="#3b82f6"/>
        <rect x="202" y="30" width="14" height="75" rx="3" fill="#f43f5e" stroke="#ef4444" stroke-width="1.5"/>
        <rect x="219" y="55" width="14" height="50" rx="3" fill="#10b981"/>
        <text x="202" y="122" font-size="10" font-weight="700" fill="#fca5a5">Oct (!)</text>

        <!-- Month 4: Nov -->
        <rect x="265" y="10" width="14" height="95" rx="3" fill="#3b82f6"/>
        <rect x="282" y="62" width="14" height="43" rx="3" fill="#f43f5e"/>
        <rect x="299" y="50" width="14" height="55" rx="3" fill="#10b981"/>
        <text x="282" y="122" font-size="10" fill="#64748b">Nov</text>
      </g>

      <!-- Anomaly Alert Detail Box -->
      <g transform="translate(20, 222)">
        <rect width="327" height="44" rx="8" fill="rgba(239, 68, 68, 0.08)" stroke="rgba(239, 68, 68, 0.25)" stroke-width="1"/>
        <text x="12" y="18" font-size="11" font-weight="700" fill="#f87171">Outlier Triggered (Isolation Forest)</text>
        <text x="12" y="34" font-size="10" fill="#cbd5e1">Oct 24: ₹18,500 Out-of-pattern electronics charge detected</text>
      </g>
    </g>
  </g>

  <!-- Bottom System Banner -->
  <g transform="translate(25, 488)">
    <rect width="750" height="92" rx="12" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    
    <!-- Left Tech Stack Pills -->
    <g transform="translate(20, 18)">
      <text x="0" y="15" font-size="12" font-weight="700" fill="#ffffff">Architecture &amp; Reliability</text>
      <g transform="translate(0, 26)">
        <!-- Pill 1 -->
        <rect x="0" y="0" width="105" height="24" rx="6" fill="rgba(6, 182, 212, 0.15)"/>
        <text x="10" y="16" font-size="10" font-weight="600" fill="#38bdf8">FastAPI + Python</text>

        <!-- Pill 2 -->
        <rect x="115" y="0" width="125" height="24" rx="6" fill="rgba(16, 185, 129, 0.15)"/>
        <text x="125" y="16" font-size="10" font-weight="600" fill="#34d399">Integer-Paise (ACID)</text>

        <!-- Pill 3 -->
        <rect x="250" y="0" width="130" height="24" rx="6" fill="rgba(59, 130, 246, 0.15)"/>
        <text x="260" y="16" font-size="10" font-weight="600" fill="#60a5fa">Pandas &amp; Scikit-Learn</text>

        <!-- Pill 4 -->
        <rect x="390" y="0" width="135" height="24" rx="6" fill="rgba(244, 63, 94, 0.15)"/>
        <text x="400" y="16" font-size="10" font-weight="600" fill="#fb7185">Grounded AI (Zero-Halluc)</text>
      </g>
    </g>

    <!-- Right Test Suite Pass Badge -->
    <g transform="translate(560, 24)">
      <rect width="170" height="44" rx="8" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
      <circle cx="22" cy="22" r="10" fill="#10b981"/>
      <path d="M18 22l3 3 5-5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="40" y="19" font-size="11" font-weight="700" fill="#34d399">25 / 25 Tests Passed</text>
      <text x="40" y="33" font-size="9" fill="#94a3b8">Automated Verification</text>
    </g>
  </g>
</svg>